database:
  host: ""
  port: 3306
  username: ""
  password: ""
  database: ""

enable-bstats: true #будьти добры, не выклучайте пж(
use-papi: true
update-checker: true

inventory-selling:
  money_auc: true
  rubles_auc: true
  min-items: 5                # Минимум предметов в инвентаре для /ah sellinv
  min-price: 100             # Минимальная цена за инвентарь
  max-price: 1000000         # Максимальная цена за инвентарь

# Ограничения цен для аукционов
price-limits:
  min-price-money-auc: 100        # Минимальная цена для обычного аукциона
  min-price-money-dauc: 150       # Минимальная цена для донатерского аукциона
  max-price-money-auc: 100000000  # Максимальная цена для обычного аукциона
  max-price-money-dauc: 1000000   # Максимальная цена для донатерского аукциона

# Комиссия за выставление лотов (снимается с баланса продавца при выставлении)
# У покупателя комиссии НЕТ — она только у продавца.
commission:
  enabled: true
  sell:                                   # /ah sell и /dah sell
    mode: PERCENT                          # FIXED — фиксированная сумма, PERCENT — процент от цены лота
    fixed: 500                             # сумма для mode: FIXED
    percent: 25                            # процент для mode: PERCENT (от цены выставления)
    min: 50                               # минимальная комиссия (чтобы с копеечных лотов не было 0)
    currency: VAULT                        # валюта комиссии (VAULT или PLAYER_POINTS)
  sell-inventory:                         # /ah sellinv и /dah sellinv
    mode: FIXED                           # по умолчанию фиксированная сумма в монетах
    fixed: 1000
    percent: 10
    min: 100
    currency: VAULT                        # валюта комиссии (VAULT или PLAYER_POINTS)

cooldowns:
  update-auc: 0.3 #(0.3 = 300 миллисекунд, 1.0 = 1 секунда)
  take-item: 0.3 #кд на забирае предметов из просроченных/активных лотах менюшке
  enable-cooldown-message: false
  enable-cooldown: true

vault-auc:
  groups:
    default: 1
    developer: 100
  priorities:
    default: 1
    developer: 2

playerpoints-auc:
  groups:
    default: 1
    developer: 100
  priorities:
    default: 1
    developer: 2

prefix: "%frostmine_name_nosub% &7»"

auction:
  max-storage-days: 5

